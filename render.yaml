services:
  - type: web
    name: spotsim
    runtime: node
    plan: free
    buildCommand: "echo no-build"
    startCommand: "node server.js"
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true
      - key: NODE_VERSION
        value: "20"
